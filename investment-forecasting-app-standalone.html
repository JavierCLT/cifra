<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Investment Forecasting App - Standalone</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
input, button { margin: 5px; }
#data-table { margin-top: 20px; border-collapse: collapse; width: 100%; }
#data-table th, #data-table td { border: 1px solid #ccc; padding: 8px; }
#message { color: red; }
</style>
</head>
<body>
<h1>Investment Forecasting App (Standalone Demo)</h1>
<p>This simplified demo stores and retrieves forecasting data using <strong>IndexedDB</strong>. It is a proof-of-concept and does not include all original application features.</p>
<div id="message"></div>
<form id="data-form">
  <label>Team ID: <input type="number" id="team_id" required></label>
  <label>Period Date: <input type="date" id="period_date" required></label>
  <label>Headcount: <input type="number" id="headcount" required></label>
  <button type="submit">Save</button>
</form>
<table id="data-table">
  <thead>
    <tr><th>Team ID</th><th>Period Date</th><th>Headcount</th></tr>
  </thead>
  <tbody id="data-body"></tbody>
</table>
<script>
// IndexedDB setup
const DB_NAME = 'cifraStandalone';
const DB_VERSION = 1;
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onerror = () => reject('Failed to open IndexedDB');
    request.onsuccess = () => { db = request.result; resolve(); };
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      const store = db.createObjectStore('actuals', { keyPath: ['team_id', 'period_date'] });
      store.createIndex('team_id', 'team_id');
    };
  });
}

function saveData(data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('actuals', 'readwrite');
    const store = tx.objectStore('actuals');
    const request = store.put(data);
    request.onsuccess = () => resolve();
    request.onerror = () => reject('Failed to save data');
  });
}

function fetchData() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('actuals', 'readonly');
    const store = tx.objectStore('actuals');
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject('Failed to fetch data');
  });
}

function renderData(rows) {
  const tbody = document.getElementById('data-body');
  tbody.innerHTML = '';
  rows.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row.team_id}</td><td>${row.period_date}</td><td>${row.headcount}</td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('data-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = document.getElementById('message');
  message.textContent = '';
  const data = {
    team_id: parseInt(document.getElementById('team_id').value, 10),
    period_date: document.getElementById('period_date').value,
    headcount: parseInt(document.getElementById('headcount').value, 10)
  };
  try {
    await saveData(data);
    const rows = await fetchData();
    renderData(rows);
  } catch (err) {
    message.textContent = err;
  }
});

initDB().then(fetchData).then(renderData).catch(err => {
  document.getElementById('message').textContent = err;
});
</script>
</body>
</html>
